# Perfiles:
#   core - Kafka, Redis A, Redis B, TimescaleDB
#   dev  - utilidades para mirar el sistema (kafka-ui)
#   obs  - observabilidad (Bloque 5)
#   init - tareas de un solo uso (creación de tópicos); se corren con `make topics`
name: anomalous

services:
  kafka:
    profiles: [core]
    image: ${KAFKA_IMAGE}
    restart: unless-stopped
    ports:
      # Listener EXTERNAL: solo para depurar desde el host. Los servicios usan kafka:9092.
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Un solo broker: todos los factores de replicación en 1 (ADR-002).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se crean como código (deploy/kafka/create-topics.sh).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis-a:
    profiles: [core]
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_A_PORT}:6379"
    volumes:
      - ./redis/redis-a.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-b:
    profiles: [core]
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_B_PORT}:6379"
    volumes:
      - ./redis/redis-b.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-b-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    profiles: [core]
    image: ${TIMESCALEDB_IMAGE}
    restart: unless-stopped
    environment:
      # POSTGRES_USER es el dueño del esquema (migraciones). Cada servicio tiene su propio usuario.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SINK_DB_PASSWORD: ${SINK_DB_PASSWORD}
      PANEL_DB_PASSWORD: ${PANEL_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./timescaledb/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Corre create-topics.sh y termina. Se lanza con `make topics`, no con `make up`.
  kafka-init:
    profiles: [init]
    image: ${KAFKA_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_PARTITIONS: ${EVENTS_PARTITIONS}
      ALERTS_PARTITIONS: ${ALERTS_PARTITIONS}
      ACTOR_RISK_PARTITIONS: ${ACTOR_RISK_PARTITIONS}
      DLQ_PARTITIONS: ${DLQ_PARTITIONS}
      POLICIES_PARTITIONS: ${POLICIES_PARTITIONS}
      EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS}
      ALERTS_RETENTION_DAYS: ${ALERTS_RETENTION_DAYS}
      DLQ_RETENTION_DAYS: ${DLQ_RETENTION_DAYS}
      COMPACT_SEGMENT_MS: ${COMPACT_SEGMENT_MS}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]

volumes:
  kafka-data:
  redis-b-data:
  timescaledb-data:
