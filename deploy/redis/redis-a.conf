# Redis A: contadores de ventana y perfiles de comportamiento.
# Es un caché derivado: se puede perder y reconstruir, por eso no persiste.
# En Fase I el Gateway todavía no lo usa.

maxmemory 256mb
# Desaloja primero las claves con TTL más corto. Todas las claves de A llevan TTL.
maxmemory-policy volatile-ttl

save ""
appendonly no
