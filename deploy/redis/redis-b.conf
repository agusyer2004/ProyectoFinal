# Redis B: estado de control (idempotencia, nonces, locks por recurso).
# Perder una clave abre una ventana de replay o de doble gasto, así que:
#  - nunca desaloja: ante falta de memoria rechaza escrituras (el Gateway decide por política de falla);
#  - persiste con AOF para sobrevivir a un reinicio.
# En Fase I el Gateway todavía no lo usa.

maxmemory 128mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save ""
